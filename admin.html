<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE AI — Admin Panel</title><style>:root{--bg:#07080b;--panel:#101218;--line:#292d37;--txt:#f7f7f8;--muted:#979daa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#222733 0,#07080b 35%);color:var(--txt);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#101218;border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:16px}input,button{font:inherit}.field{width:100%;background:#08090d;color:#fff;border:1px solid #292e39;border-radius:10px;padding:11px}.btn{background:#171a22;color:#fff;border:1px solid #2b303b;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:#fff;color:#000;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #242833;padding:9px;text-align:left}small{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ONE AI Admin Panel</h1><small>Private control panel. Use the admin email + strong password stored in your server .env file. Never share them.</small><div class="card"><h2>Admin login</h2><input id="email" class="field" type="email" placeholder="Admin email"><input id="pw" class="field" style="margin-top:8px" type="password" placeholder="Strong admin password"><button class="btn primary" style="margin-top:10px" onclick="load()">Open dashboard</button><div id="msg" style="margin-top:10px"></div></div><div id="dash" style="display:none"><div class="grid"><div class="card"><h2>PRO</h2><input id="proPrice" class="field" placeholder="Price ₹"><input id="proImages" class="field" style="margin-top:8px" placeholder="Image credits"><input id="proVideos" class="field" style="margin-top:8px" placeholder="Video credits"><button class="btn primary" style="margin-top:10px" onclick="savePlan('PRO')">Save PRO</button></div><div class="card"><h2>CREATOR</h2><input id="crPrice" class="field" placeholder="Price ₹"><input id="crImages" class="field" style="margin-top:8px" placeholder="Image credits"><input id="crVideos" class="field" style="margin-top:8px" placeholder="Video credits"><button class="btn primary" style="margin-top:10px" onclick="savePlan('CREATOR')">Save CREATOR</button></div></div><div class="card"><h2>Users</h2><div id="users"></div></div><div class="card"><h2>Orders</h2><div id="orders"></div></div><a class="btn" href="/">← Back to ONE AI</a></div></div><script>let pw='',email='';async function load(){email=document.getElementById('email').value.trim();pw=document.getElementById('pw').value;const headers={'x-admin-email':email,'x-admin-password':pw};const r=await fetch('/api/admin/summary',{headers});const j=await r.json();if(!r.ok){document.getElementById('msg').innerText=j.error||'Login failed';return}document.getElementById('dash').style.display='block';for(const [k,p] of Object.entries(j.plans)){if(k==='PRO'){proPrice.value=p.price;proImages.value=p.images;proVideos.value=p.videos}else{crPrice.value=p.price;crImages.value=p.images;crVideos.value=p.videos}}document.getElementById('users').innerHTML='<table><tr><th>Email</th><th>Plan</th><th>Credits</th><th>Created</th></tr>'+j.users.map(u=>`<tr><td>${u.email}</td><td>${u.plan}</td><td>${JSON.stringify(u.credits||{})}</td><td>${u.createdAt||''}</td></tr>`).join('')+'</table>';document.getElementById('orders').innerHTML='<table><tr><th>Order</th><th>Email</th><th>Plan</th><th>Status</th><th>Amount</th></tr>'+j.orders.map(o=>`<tr><td>${o.id}</td><td>${o.email}</td><td>${o.plan}</td><td>${o.status}</td><td>₹${(o.amount||0)/100}</td></tr>`).join('')+'</table>'}async function savePlan(name){const isPro=name==='PRO';const body={name,price:Number(isPro?proPrice.value:crPrice.value),images:Number(isPro?proImages.value:crImages.value),videos:Number(isPro?proVideos.value:crVideos.value)};const r=await fetch('/api/admin/plan',{method:'POST',headers:{'Content-Type':'application/json','x-admin-email':email,'x-admin-password':pw},body:JSON.stringify(body)});const j=await r.json();document.getElementById('msg').innerText=j.error||'Plan saved';}</script></body></html>
